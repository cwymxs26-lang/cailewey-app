<script>
    // ESTA ES TU NUEVA URL ACTUALIZADA
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyV1L5FQ675WB9HcDp99Jw-KzFfUg4e4GMOMcQGA3XCR20XVmz83LkV-9wqTEp4yVKi/exec';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const btn = e.target.querySelector('button');

        btn.innerText = 'Verificando...';
        btn.disabled = true;

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'cors', // Cambiado a cors para recibir la respuesta JSON
            body: JSON.stringify({
                accion: "login",
                phone: phone,
                password: password
            })
        })
        .then(res => res.json())
        .then(response => {
            if (response.result === 'success') {
                // Guardamos los datos para usarlos en el Dashboard
                localStorage.setItem('usuarioNombre', response.nombre);
                localStorage.setItem('usuarioID', response.id);
                
                alert('¡Bienvenido ' + response.nombre + '!');
                window.location.href = 'dashboard.html'; 
            } else {
                alert('Datos incorrectos o usuario no encontrado.');
                btn.innerText = 'Ingresar';
                btn.disabled = false;
            }
        })
        .catch(err => {
            console.error(err);
            alert('Error de conexión con la base de datos.');
            btn.innerText = 'Ingresar';
            btn.disabled = false;
        });
    });
</script>
