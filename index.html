<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { 
            background: url('photo-1764605513771-c6a9789a4eb2.jpeg') no-repeat center center fixed; 
            background-size: cover; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
        }
        .glass { 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(10px); 
            border-radius: 25px; 
            padding: 40px; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            border: 1px solid rgba(255,193,7,0.3); 
        }
        .logo h1 { color: #ffc107; font-weight: 900; margin-bottom: 30px; letter-spacing: 2px; }
        .input-box { position: relative; margin-bottom: 20px; }
        .input-box span { position: absolute; left: 15px; top: 12px; color: #ffc107; }
        .input-box input { 
            width: 100%; 
            padding: 12px 12px 12px 45px; 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px; 
            color: white; 
            outline: none; 
        }
        /* Botón real, no un enlace */
        .btn-orange { 
            background: linear-gradient(to right, #ff8c00, #ed5611); 
            border: none; 
            color: white; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
        }
        .btn-link { color: #ffc107; text-decoration: none; font-size: 0.9rem; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="glass">
        <div class="logo"><h1>CAILEWEY</h1></div>
        
        <div class="input-box">
            <span class="material-symbols-outlined">call</span>
            <input type="tel" id="login-celular" placeholder="Número de Celular">
        </div>
        
        <div class="input-box">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="login-pass" placeholder="Contraseña">
        </div>
        
        <button type="button" class="btn-orange" onclick="validarLogin()">INGRESAR</button>
        
        <a href="registro.html" class="btn-link">Crear una cuenta nueva</a>
        <a href="olvide.html" class="btn-link" style="color: #bbb; font-size: 0.8rem;">Olvidé mi contraseña</a>
    </div>

    <script>
        function validarLogin() {
            const campoCelular = document.getElementById('login-celular').value.trim();
            const campoPass = document.getElementById('login-pass').value.trim();

            // 1. Verificar si los campos están vacíos
            if (campoCelular === "" || campoPass === "") {
                alert("Por favor, ingresa tu celular y contraseña.");
                return; // Detiene la función aquí mismo
            }

            // 2. Obtener los datos del usuario registrado en este teléfono
            const datosGuardados = JSON.parse(localStorage.getItem('userCailewey'));

            // 3. Validar contra los datos guardados
            if (datosGuardados) {
                if (datosGuardados.celular === campoCelular && datosGuardados.password === campoPass) {
                    // Si todo coincide, entramos
                    window.location.href = 'dashboard.html';
                } else {
                    // Si los datos no coinciden
                    alert("Celular o contraseña incorrectos. Intenta de nuevo.");
                }
            } else {
                // Si no hay ningún usuario registrado en este teléfono aún
                alert("No se encontró ninguna cuenta registrada en este dispositivo.");
            }
        }
    </script>
</body>
</html>
