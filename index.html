<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Auxilio Vial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: sans-serif; 
            padding-bottom: 50px; 
        }

        .card { 
            background-color: #1e1e1e; 
            border: 1px solid #444; 
            border-radius: 15px; 
            margin-bottom: 15px; 
        }

        .card-header { 
            background-color: #252525; 
            color: #ffc107; 
            font-weight: bold; 
            border-bottom: 1px solid #444; 
            border-radius: 15px 15px 0 0 !important; 
            text-align: center;
        }

        .btn-qty { 
            width: 45px; height: 45px; border-radius: 50%; 
            border: 2px solid #ffc107; background: transparent; 
            color: #ffc107; font-size: 22px; font-weight: bold;
        }

        .btn-help { 
            background: linear-gradient(145deg, #d9534f, #c9302c); 
            color: white; font-weight: bold; border: none; 
            padding: 20px; border-radius: 15px; width: 100%; 
            font-size: 1.4rem; box-shadow: 0 5px 15px rgba(217, 83, 79, 0.4); 
        }

        .btn-back {
            background-color: transparent;
            color: #ffc107;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .form-select, .form-control { 
            background-color: #2d2d2d; border: 1px solid #555; color: #ffffff !important; 
        }

        .hidden { display: none; }
        .badge-qty { font-size: 1.5rem; color: #ffc107; font-weight: bold; padding: 0 15px; }
        input[type=range] { accent-color: #ffc107; }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="text-center mb-4" style="color: #ffc107; font-weight: 800;">CAILEWEY</h1>

    <div id="section-login" class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 text-center">
                <h4 class="mb-4">Iniciar Sesión</h4>
                <input type="text" class="form-control mb-3" placeholder="Usuario">
                <input type="password" class="form-control mb-3" placeholder="Contraseña">
                <button class="btn btn-warning w-100 mb-3 fw-bold" onclick="showSection('section-main')">ENTRAR</button>
                <div class="small">
                    <a href="#" class="text-warning text-decoration-none" onclick="showSection('section-register')">Crear Cuenta</a> | 
                    <a href="#" class="text-warning text-decoration-none" onclick="showSection('section-forgot')">Olvidé Contraseña</a>
                </div>
            </div>
        </div>
    </div>

    <div id="section-register" class="hidden">
        <button class="btn-back" onclick="showSection('section-login')">← REGRESAR</button>
        <div class="card p-4">
            <h3 class="text-center mb-4 text-warning">Registro Nuevo</h3>
            <input type="text" class="form-control mb-2" placeholder="Nombre Completo">
            <input type="tel" class="form-control mb-2" placeholder="Número de Celular">
            <input type="text" class="form-control mb-2" placeholder="Marca de Moto">
            <input type="text" class="form-control mb-2" placeholder="Modelo">
            <input type="number" class="form-control mb-3" placeholder="Año">
            <button class="btn btn-warning w-100 fw-bold" onclick="showSection('section-login')">REGISTRAR</button>
        </div>
    </div>
