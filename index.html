<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Auxilio Vial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding-bottom: 50px; }
        .card { background-color: #1e1e1e; border: 1px solid #444; border-radius: 15px; margin-bottom: 15px; }
        .card-header { background-color: #252525; color: #ffc107; font-weight: bold; border-bottom: 1px solid #444; border-radius: 15px 15px 0 0 !important; text-align: center; }
        .btn-qty { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ffc107; background: transparent; color: #ffc107; font-size: 22px; font-weight: bold; }
        .btn-help { background: linear-gradient(145deg, #d9534f, #c9302c); color: white; font-weight: bold; border: none; padding: 20px; border-radius: 15px; width: 100%; font-size: 1.4rem; box-shadow: 0 5px 15px rgba(217, 83, 79, 0.4); }
        .btn-back { background-color: transparent; color: #ffc107; border: 1px solid #ffc107; border-radius: 10px; padding: 10px 20px; font-weight: bold; margin-bottom: 20px; cursor: pointer; }
        .form-select, .form-control { background-color: #2d2d2d; border: 1px solid #555; color: #ffffff !important; }
        .hidden { display: none !important; }
        .badge-qty { font-size: 1.5rem; color: #ffc107; font-weight: bold; padding: 0 15px; }
        input[type=range] { accent-color: #ffc107; }
        a { cursor: pointer; }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="text-center mb-4" style="color: #ffc107; font-weight: 800;">CAILEWEY</h1>

    <div id="section-login" class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 text-center shadow">
                <h4 class="mb-4 text-warning">Iniciar Sesión</h4>
                <input type="text" class="form-control mb-3" placeholder="Usuario (Tu celular)">
                <input type="password" class="form-control mb-3" placeholder="Contraseña">
                <button class="btn btn-warning w-100 mb-4 fw-bold" onclick="showSection('section-main')">ENTRAR</button>
                <div class="d-flex justify-content-around">
                    <a class="text-warning text-decoration-none small" onclick="showSection('section-register')">Crear Cuenta</a>
                    <span class="text-secondary">|</span>
                    <a class="text-warning text-decoration-none small" onclick="showSection('section-forgot')">Olvidé Clave</a>
                </div>
            </div>
        </div>
    </div>

    <div id="section-register" class="hidden">
        <button class="btn-back" onclick="showSection('section-login')">← REGRESAR</button>
        <div class="card p-4 shadow">
            <h3 class="text-center mb-4 text-warning">Registro de Motociclista</h3>
            <input type="text" class="form-control mb-2" placeholder="Nombre Completo">
            <input type="tel" class="form-control mb-2" placeholder="Número de Celular">
            <input type="text" class="form-control mb-2" placeholder="Marca de Moto">
            <input type="text" class="form-control mb-2" placeholder="Modelo / Cilindrada">
            <input type="number" class="form-control mb-3" placeholder="Año">
            <button class="btn btn-warning w-100 fw-bold" onclick="showSection('section-login')">FINALIZAR REGISTRO</button>
        </div>
    </div>

    <div id="section-forgot" class="hidden">
        <button class="btn-back" onclick="showSection('section-login')">← REGRESAR</button>
        <div class="card p-4 text-center shadow">
            <h3 class="text-warning">Recuperar Clave</h3>
            <p class="text-secondary small">Escribe tu celular registrado para enviarte tu clave vía WhatsApp.</p>
            <input type="tel" id="forgot-phone" class="form-control mb-4" placeholder="Tu celular (10 dígitos)">
            <button class="btn btn-warning w-100 fw-bold" onclick="enviarWA('pass')">SOLICITAR POR WHATSAPP</button>
        </div>
    </div>

    <div id="section-main" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-outline-warning btn-sm" onclick="showSection('section-login')">← SALIR</button>
            <span class="badge bg-dark border border-warning text-warning">En línea</span>
        </div>
        
        <div class="card shadow">
            <div class="card-header">⛽ GASOLINA</div>
            <div class="card-body d-flex justify-content-between align-items-center">
                <span class="fw-bold">Litros:</span>
                <div class="d-flex align-items-center">
                    <button class="btn-qty" onclick="updateVal('gas', -1)">-</button>
                    <span id="qty-gas" class="badge-qty">0</span>
                    <button class="btn-qty" onclick="updateVal('gas', 1)">+</button>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header">🛢️ ACEITE</div>
            <div class="card-body">
                <select class="form-select mb-3" id="oil-type">
                    <option value="4 Tiempos">Aceite 4 Tiempos</option>
                    <option value="2 Tiempos">Aceite 2 Tiempos</option>
                </select>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Litros:</span>
                    <div class="d-flex align-items-center">
                        <button class="btn-qty" onclick="updateVal('oil', -1)">-</button>
                        <span id="qty-oil" class="badge-qty">0</span>
                        <button class="btn-qty" onclick="updateVal('oil', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header">🔧 EMERGENCIAS</div>
            <div class="card-body">
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="check-patch"><label class="form-check-label ms-2">Parche Ponchadura</label></div>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="check-tire"><label class="form-check-label ms-2">Cambio de Llanta</label></div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="check-tow"><label class="form-check-label ms-2">Remolque</label></div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header">📦 ACCESORIOS</div>
            <div class="card-body text-center">
                <input type="range" class="form-range" min="0" max="5" step="1" id="acc-slider" value="0" oninput="updateAcc(this.value)">
                <div class="d-flex justify-content-between small text-secondary"><span>Nada</span><span>Bujía</span><span>Cadena</span><span>Cámara</span><span>Espejo</span><span>Cable</span></div>
                <div class="mt-3"><span class="badge bg-warning text-dark p-2" id="lbl-acc">Elegido: Ninguno</span></div>
            </div>
        </div>

        <button class="btn-help shadow" onclick="enviarSolicitud()">🚀 PEDIR AYUDA AHORA</button>
    </div>
</div>

<script>
    const MI_TEL = "523319053634";
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxT5-kucWayUcXkl9n99uLBIYcWkjsRl2T9vf-5h3PO0J4PMCeMToOTYgIIcY9csziCPg/exec";
    
    let vals = { gas: 0, oil: 0 };
    const accesorios = ["Ninguno", "Bujía", "Cadena", "Cámara de aire", "Espejo", "Cable"];
    let accSelected = accesorios[0];

    function showSection(id) {
        // Ocultar todas las secciones
        document.getElementById('section-login').classList.add('hidden');
        document.getElementById('section-register').classList.add('hidden');
        document.getElementById('section-forgot').classList.add('hidden');
        document.getElementById('section-main').classList.add('hidden');
        
        // Mostrar la sección elegida
        document.getElementById(id).classList.remove('hidden');
        window.scrollTo(0,0);
    }

    function updateVal(type, n) {
        vals[type] = Math.max(0, Math.min(2, vals[type] + n));
        document.getElementById(`qty-${type}`).innerText = vals[type];
    }

    function updateAcc(v) {
        accSelected = accesorios[v];
        document.getElementById('lbl-acc').innerText = "Elegido: " + accSelected;
    }

    function enviarSolicitud() {
        if (!navigator.geolocation) return alert("GPS no disponible");
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const linkMaps = `https://www.google.com/maps?q=${lat},${lon}`;
            
            const pedido = {
                gas: vals.gas + " L",
                aceite: `${vals.oil} L (${document.getElementById('oil-type').value})`,
                parche: document.getElementById('check-patch').checked ? "SÍ" : "NO",
                llanta: document.getElementById('check-tire').checked ? "SÍ" : "NO",
                remolque: document.getElementById('check-tow').checked ? "SÍ" : "NO",
                accesorio: accSelected,
                ubicacion: linkMaps
            };

            fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify(pedido) });

            let msj = `*⚠️ AYUDA CAILEWEY*\n⛽ Gas: ${pedido.gas}\n🛢️ Aceite: ${pedido.aceite}\n🔧 Parche: ${pedido.parche}\n🔘 Llanta: ${pedido.llanta}\n🚜 Remolque: ${pedido.remolque}\n📦 Acc: ${accSelected}\n📍 Ubicación:\n${linkMaps}`;
            window.open(`https://wa.me/${MI_TEL}?text=${encodeURIComponent(msj)}`, '_blank');
        }, () => alert("Activa el GPS para pedir ayuda."));
    }

    function enviarWA(tipo) {
        const tel = document.getElementById('forgot-phone').value;
        if(!tel) return alert("Ingresa tu celular");
        window.open(`https://wa.me/${MI_TEL}?text=Hola, olvidé mi clave de Cailewey. Celular: ${tel}`, '_blank');
        showSection('section-login');
    }
</script>
</body>
</html>
