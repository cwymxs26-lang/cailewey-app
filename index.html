<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { 
            background: url('photo-1764605513771-c6a9789a4eb2.jpeg') no-repeat center center fixed; 
            background-size: cover; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: sans-serif; 
            margin: 0;
        }
        .glass { 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(10px); 
            border-radius: 25px; 
            padding: 25px; 
            width: 90%; 
            max-width: 400px; 
            color: white; 
            border: 1px solid rgba(255,193,7,0.3);
            overflow-y: auto;
            max-height: 95vh;
        }
        .text-warning { color: #ffc107 !important; font-weight: bold; }
        .input-box { position: relative; margin-bottom: 12px; }
        .input-box span { position: absolute; left: 15px; top: 12px; color: #ffc107; }
        .input-box input { 
            width: 100%; 
            padding: 10px 10px 10px 45px; 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px; 
            color: white; 
            outline: none; 
        }
        .btn-orange { 
            background: linear-gradient(to right, #ff8c00, #ed5611); 
            border: none; 
            color: white; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            margin-top: 10px;
        }
        .small-link { color: #ffc107; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="glass">
        <h3 class="text-center mb-3 text-warning">CREAR CUENTA</h3>
        
        <div class="input-box">
            <span class="material-symbols-outlined">person</span>
            <input type="text" id="reg-nombre" placeholder="Nombre Completo">
        </div>
        <div class="input-box">
            <span class="material-symbols-outlined">call</span>
            <input type="tel" id="reg-celular" placeholder="Número de Celular (Usuario)">
        </div>
        <div class="input-box">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="reg-pass" placeholder="Crear Contraseña">
        </div>

        <hr style="border-color: rgba(255,255,255,0.2)">
        
        <div class="input-box">
            <span class="material-symbols-outlined">motorcycle</span>
            <input type="text" id="reg-marca" placeholder="Marca de la Moto">
        </div>
        <div class="input-box">
            <span class="material-symbols-outlined">settings_suggest</span>
            <input type="text" id="reg-modelo" placeholder="Modelo">
        </div>
        <div class="input-box">
            <span class="material-symbols-outlined">calendar_today</span>
            <input type="number" id="reg-anio" placeholder="Año (Ej: 2024)">
        </div>
        
        <button class="btn-orange" onclick="guardarRegistro()">REGISTRARME</button>
        
        <div class="text-center mt-3">
            <a href="index.html" class="small-link">¿Ya tienes cuenta? Ingresa aquí</a>
        </div>
    </div>

    <script>
        function guardarRegistro() {
            // Capturar todos los campos
            const nombre = document.getElementById('reg-nombre').value.trim();
            const celular = document.getElementById('reg-celular').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const marca = document.getElementById('reg-marca').value.trim();
            const modelo = document.getElementById('reg-modelo').value.trim();
            const anio = document.getElementById('reg-anio').value.trim();

            // Validación: Que nada esté vacío
            if(!nombre || !celular || !pass || !marca || !modelo || !anio) {
                alert("Por favor, completa todos los campos para continuar.");
                return;
            }

            // Lógica del ID 2601...
            let ultimoID = localStorage.getItem('ultimoIDCailewey') || "260100000000000";
            let nuevoID = (BigInt(ultimoID) + 1n).toString();

            // Objeto con TODA la información
            const datosUsuario = {
                nombre: nombre,
                celular: celular,
                password: pass,
                marca: marca,
                modelo: modelo,
                anio: anio,
                clienteId: nuevoID 
            };

            // Guardar en la memoria del teléfono
            localStorage.setItem('userCailewey', JSON.stringify(datosUsuario));
            localStorage.setItem('ultimoIDCailewey', nuevoID);

            alert("¡Cuenta creada con éxito!\nTu ID de cliente es: " + nuevoID);
            
            // Mandarlo al login para que entre con sus nuevos datos
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
