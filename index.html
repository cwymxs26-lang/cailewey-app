<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background: url('1000058499.png') no-repeat center center fixed; background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; margin: 0; }
        .glass { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 40px; width: 100%; max-width: 380px; text-align: center; }
        .logo h1 { color: #ffc107; font-weight: 800; margin-bottom: 30px; letter-spacing: 2px; }
        .input-box { position: relative; margin-bottom: 20px; }
        .input-box span { position: absolute; left: 15px; top: 12px; color: #ffc107; }
        .input-box input { width: 100%; padding: 12px 12px 12px 45px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; outline: none; }
        .btn-orange { background: linear-gradient(to right, #ff8c00, #ed5611); border: none; color: white; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; text-transform: uppercase; text-decoration: none; display: block; }
        .btn-link { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ddd; padding: 10px; border-radius: 10px; font-size: 0.85rem; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="glass">
        <div class="logo"><h1>CAILEWEY</h1></div>
        <div class="input-box"><span class="material-symbols-outlined">person</span><input type="text" id="user" placeholder="Usuario"></div>
        <div class="input-box"><span class="material-symbols-outlined">lock</span><input type="password" id="pass" placeholder="Contraseña"></div>
        <a href="dashboard.html" class="btn-orange">LOGIN</a>
        <a href="registro.html" class="btn-link"><span class="material-symbols-outlined" style="font-size: 18px;">person_add</span> Registro nuevo usuario</a>
        <a href="olvide.html" class="btn-link"><span class="material-symbols-outlined" style="font-size: 18px;">key</span> Olvidé contraseña</a>
    </div>
</body>
</html>
