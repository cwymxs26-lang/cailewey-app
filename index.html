<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Auxilio Vial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fondo general y color de letra global */
        body { 
            background-color: #121212; 
            color: #ffffff; /* Texto blanco por defecto */
            font-family: sans-serif; 
            padding-bottom: 50px; 
        }

        /* Tarjetas con bordes más visibles */
        .card { 
            background-color: #1e1e1e; 
            border: 1px solid #444; 
            border-radius: 15px; 
            margin-bottom: 15px; 
        }

        /* Encabezados de las tarjetas en amarillo */
        .card-header { 
            background-color: #252525; 
            color: #ffc107; 
            font-weight: bold; 
            border-bottom: 1px solid #444; 
            border-radius: 15px 15px 0 0 !important; 
            font-size: 1.1rem;
        }

        /* Asegurar que el texto dentro de la card sea blanco */
        .card-body, .form-check-label, .form-label {
            color: #ffffff !important;
        }

        /* Estilo de los botones de cantidad */
        .btn-qty { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            border: 2px solid #ffc107; 
            background: transparent; 
            color: #ffc107; 
            font-size: 22px; 
            font-weight: bold;
            transition: 0.2s; 
        }
        .btn-qty:active { background: #ffc107; color: black; }

        /* Botón principal de Ayuda */
        .btn-help { 
            background: linear-gradient(145deg, #d9534f, #c9302c); 
            color: white; 
            font-weight: bold; 
            border: none; 
            padding: 20px; 
            border-radius: 15px; 
            width: 100%; 
            font-size: 1.4rem; 
            box-shadow: 0 5px 15px rgba(217, 83, 79, 0.4); 
            text-transform: uppercase;
        }

        /* Inputs y Selects */
        .form-select, .form-control { 
            background-color: #2d2d2d; 
            border: 1px solid #555; 
            color: #ffffff !important; 
        }
        .form-select:focus { border-color: #ffc107; box-shadow: none; background-color: #333; color: white; }

        /* Estilo para los textos pequeños debajo del slider */
        .slider-labels span {
            color: #bbb;
            font-size: 0.8rem;
        }

        .badge-qty { 
            font-size: 1.5rem; 
            padding: 0 20px; 
            min-width: 50px; 
            text-align: center; 
            font-weight: bold;
            color: #ffc107;
        }

        input[type=range] { accent-color: #ffc107; }

        /* Color de los switches (interruptores) */
        .form-check-input:checked {
            background-color: #ffc107;
            border-color: #ffc107;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="text-center mb-4" style="color: #ffc107; font-weight: 800; letter-spacing: 2px;">CAILEWEY</h1>

    <div id="section-main">
        <div class="card shadow">
            <div class="card-header text-center">⛽ SUMINISTRO DE GASOLINA</div>
            <div class="card-body d-flex justify-content-between align-items-center">
                <span class="fw-bold">Cantidad (Litros):</span>
                <div class="d-flex align-items-center">
                    <button class="btn-qty" onclick="updateVal('gas', -1)">-</button>
                    <span id="qty-gas" class="badge-qty">0</span>
                    <button class="btn-qty" onclick="updateVal('gas', 1)">+</button>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header text-center">🛢️ SUMINISTRO DE ACEITE</div>
            <div class="card-body">
                <label class="form-label fw-bold">Tipo de Motor:</label>
                <select class="form-select mb-4" id="oil-type">
                    <option value="4 Tiempos">Aceite 4 Tiempos (Moto estándar)</option>
                    <option value="2 Tiempos">Aceite 2 Tiempos (Motoneta/Scooter)</option>
                </select>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Cantidad (Litros):</span>
                    <div class="d-flex align-items-center">
                        <button class="btn-qty" onclick="updateVal('oil', -1)">-</button>
                        <span id="qty-oil" class="badge-qty">0</span>
                        <button class="btn-qty" onclick="updateVal('oil', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header text-center">🔧 SERVICIOS DE EMERGENCIA</div>
            <div class="card-body">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="check-patch" style="height: 25px; width: 50px;">
                    <label class="form-check-label ms-3 fw-bold">Parche por ponchadura</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="check-tire" style="height: 25px; width: 50px;">
                    <label class="form-check-label ms-3 fw-bold">Cambio de Llanta</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="check-tow" style="height: 25px; width: 50px;">
                    <label class="form-check-label ms-3 fw-bold">Servicio de Remolque</label>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header text-center">📦 ACCESORIOS BÁSICOS</div>
            <div class="card-body text-center">
                <label class="form-label d-block mb-3 fw-bold text-start">Desliza para elegir:</label>
                <input type="range" class="form-range" min="0" max="5" step="1" id="acc-slider" value="0" oninput="updateAcc(this.value)">
                <div class="d-flex justify-content-between slider-labels px-1">
                    <span>Nada</span><span>Bujía</span><span>Cadena</span><span>Cámara</span><span>Espejo</span><span>Cable</span>
                </div>
                <div class="mt-4"><span class="badge bg-warning text-dark p-2 fs-6" id="lbl-acc">Elegido: Ninguno</span></div>
            </div>
        </div>

        <div class="mt-5 text-center">
            <button class="btn-help" onclick="enviarSolicitud()">🚀 ENVIAR PEDIDO DE AYUDA</button>
            <p class="mt-3 text-secondary" style="font-size: 0.9rem;">Se enviará ubicación real y reporte al 3319053634</p>
        </div>
    </div>
</div>

<script>
    const MI_TEL = "523319053634";
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxT5-kucWayUcXkl9n99uLBIYcWkjsRl2T9vf-5h3PO0J4PMCeMToOTYgIIcY9csziCPg/exec";
    
    let vals = { gas: 0, oil: 0 };
    const accesorios = ["Ninguno", "Bujía", "Cadena", "Cámara de aire", "Espejo", "Cable"];
    let accSelected = accesorios[0];

    function updateVal(type, n) {
        vals[type] = Math.max(0, Math.min(2, vals[type] + n));
        document.getElementById(`qty-${type}`).innerText = vals[type];
    }

    function updateAcc(v) {
        accSelected = accesorios[v];
        document.getElementById('lbl-acc').innerText = "Elegido: " + accSelected;
    }

    function enviarSolicitud() {
        if (!navigator.geolocation) return alert("GPS no disponible en tu dispositivo.");

        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const linkMaps = `https://www.google.com/maps?q=${lat},${lon}`;
            
            const pedido = {
                gas: vals.gas + " L",
                aceite: `${vals.oil} L (${document.getElementById('oil-type').value})`,
                parche: document.getElementById('check-patch').checked ? "SÍ" : "NO",
                llanta: document.getElementById('check-tire').checked ? "SÍ" : "NO",
                remolque: document.getElementById('check-tow').checked ? "SÍ" : "NO",
                accesorio: accSelected,
                ubicacion: linkMaps
            };

            // 1. Enviar a Google Sheets
            fetch(URL_APPS_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(pedido)
            });

            // 2. Generar mensaje WhatsApp
            let msj = `*⚠️ SOLICITUD DE AYUDA CAILEWEY*\n\n`;
            if(vals.gas > 0) msj += `⛽ Gasolina: ${pedido.gas}\n`;
            if(vals.oil > 0) msj += `🛢️ Aceite: ${pedido.aceite}\n`;
            if(pedido.parche === "SÍ") msj += `🔧 Parche: SÍ\n`;
            if(pedido.llanta === "SÍ") msj += `🔘 Llanta: SÍ\n`;
            if(pedido.remolque === "SÍ") msj += `🚜 Remolque: SÍ\n`;
            if(accSelected !== "Ninguno") msj += `📦 Accesorio: ${accSelected}\n`;
            msj += `\n📍 Mi ubicación exacta:\n${linkMaps}`;

            window.open(`https://wa.me/${MI_TEL}?text=${encodeURIComponent(msj)}`, '_blank');
            alert("¡Pedido enviado con éxito! Revisa tu WhatsApp.");

        }, () => alert("Para enviarte ayuda es obligatorio activar el GPS."));
    }
</script>

</body>
</html>
