<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background: url('photo-1764605513771-c6a9789a4eb2.jpeg') no-repeat center center fixed; background-size: cover; color: white; padding: 15px; padding-bottom: 120px; }
        .glass-card { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 18px; margin-bottom: 15px; }
        .user-info { border-left: 4px solid #ffc107; padding-left: 15px; }
        .card-title { color: #ffc107; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 15px; font-size: 0.9rem; }
        .btn-qty { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ffc107; background: transparent; color: #ffc107; font-weight: bold; }
        .footer-btns { position: fixed; bottom: 20px; left: 5%; width: 90%; display: flex; gap: 10px; }
        .btn-soporte { background: #4CAF50; color: white; border: none; border-radius: 30px; padding: 15px; flex: 1; font-weight: bold; }
        .btn-pedir { background: #0d47a1; color: white; border: none; border-radius: 30px; padding: 15px; flex: 1; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="glass-card user-info">
        <h4 id="display-nombre" style="margin:0; color: #ffc107;">---</h4>
        <div id="display-moto" class="small text-white-50">---</div>
        <div class="mt-1 small fw-bold text-warning">ID: <span id="display-id">---</span></div>
    </div>

    <div class="glass-card">
        <div class="card-title">⛽ GASOLINA</div>
        <div class="d-flex justify-content-between align-items-center">
            <span>Litros:</span>
            <div class="d-flex align-items-center gap-3">
                <button class="btn-qty" onclick="updateVal('gas', -1)">-</button>
                <span id="qty-gas" class="fs-4 fw-bold">0</span>
                <button class="btn-qty" onclick="updateVal('gas', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="glass-card">
        <div class="card-title">🔧 EMERGENCIAS</div>
        <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="check-patch"><label class="ms-2">Parche / Ponchadura</label></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="check-tow"><label class="ms-2">Grúa / Remolque</label></div>
    </div>

    <div class="footer-btns">
        <button class="btn-soporte" onclick="window.location.href='https://wa.me/523319053634'">SOPORTE</button>
        <button class="btn-pedir" onclick="enviarSolicitud()">PEDIR SERVICIO</button>
    </div>

    <script>
        const cliente = JSON.parse(localStorage.getItem('userCailewey'));
        if(cliente) {
            document.getElementById('display-nombre').innerText = cliente.nombre;
            document.getElementById('display-moto').innerText = `${cliente.marca} ${cliente.modelo} (${cliente.anio})`;
            document.getElementById('display-id').innerText = cliente.clienteId;
        }

        let servicios = { gas: 0 };
        function updateVal(tipo, cambio) {
            servicios[tipo] = Math.max(0, Math.min(10, servicios[tipo] + cambio));
            document.getElementById(`qty-${tipo}`).innerText = servicios[tipo];
        }

        function enviarSolicitud() {
            navigator.geolocation.getCurrentPosition((pos) => {
                const mapa = `http://google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const mensaje = `*🆘 NUEVA SOLICITUD CAILEWEY*\n*ID:* ${cliente.clienteId}\n*Cliente:* ${cliente.nombre}\n*Moto:* ${cliente.marca} ${cliente.modelo}\n\n*Pedido:*\nGas: ${servicios.gas}L\nParche: ${document.getElementById('check-patch').checked ? 'SÍ' : 'NO'}\nGrúa: ${document.getElementById('check-tow').checked ? 'SÍ' : 'NO'}\n\n*Ubicación:* ${mapa}`;
                window.open(`https://wa.me/523319053634?text=${encodeURIComponent(mensaje)}`);
            });
        }
    </script>
</body>
</html>
