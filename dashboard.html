<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background: url('1000058499.png') no-repeat center center fixed; background-size: cover; color: white; padding: 15px; padding-bottom: 110px; }
        .glass-card { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 18px; margin-bottom: 15px; }
        .user-info { border-left: 4px solid #ffc107; padding-left: 15px; }
        .client-id { font-family: monospace; color: #ffc107; font-weight: bold; }
        .btn-qty { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ffc107; background: transparent; color: #ffc107; font-weight: bold; }
        .btn-help { background: linear-gradient(145deg, #d9534f, #c9302c); color: white; border: none; padding: 20px; border-radius: 20px; width: 90%; font-weight: bold; position: fixed; bottom: 20px; left: 5%; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="glass-card user-info">
        <h4 id="display-nombre">---</h4>
        <div id="display-moto" class="small text-secondary">---</div>
        <div class="client-id mt-1 small">Nº CLIENTE: <span id="display-id">---</span></div>
    </div>

    <div class="glass-card text-center">
        <h6 class="mb-3">⛽ GASOLINA (LITROS)</h6>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <button class="btn-qty" onclick="updateVal('gas', -1)">-</button>
            <span id="qty-gas" class="fs-4">0</span>
            <button class="btn-qty" onclick="updateVal('gas', 1)">+</button>
        </div>
    </div>

    <div class="glass-card">
        <h6>🛢️ ACEITE</h6>
        <select class="form-select mb-3" id="oil-type" style="background: rgba(255,255,255,0.1); color:white; border:none;">
            <option value="4 Tiempos">4 Tiempos</option>
            <option value="2 Tiempos">2 Tiempos</option>
        </select>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <button class="btn-qty" onclick="updateVal('oil', -1)">-</button>
            <span id="qty-oil" class="fs-4">0</span>
            <button class="btn-qty" onclick="updateVal('oil', 1)">+</button>
        </div>
    </div>

    <div class="glass-card">
        <h6>🔧 EMERGENCIAS</h6>
        <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="check-patch"><label class="small ms-2">Parche</label></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="check-tow"><label class="small ms-2">Grúa</label></div>
    </div>

    <button class="btn-help" onclick="enviarSolicitud()">🚀 SOLICITAR SERVICIO</button>

    <script>
        const cliente = JSON.parse(localStorage.getItem('userCailewey'));
        if(cliente) {
            document.getElementById('display-nombre').innerText = cliente.nombre;
            document.getElementById('display-moto').innerText = `${cliente.marca} ${cliente.modelo} (${cliente.anio})`;
            document.getElementById('display-id').innerText = cliente.clienteId;
        }

        let servicios = { gas: 0, oil: 0 };
        function updateVal(tipo, cambio) {
            servicios[tipo] = Math.max(0, Math.min(10, servicios[tipo] + cambio));
            document.getElementById(`qty-${tipo}`).innerText = servicios[tipo];
        }

        function enviarSolicitud() {
            navigator.geolocation.getCurrentPosition((pos) => {
                const mapa = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const mensaje = `*🆘 NUEVA SOLICITUD*\nCliente: ${cliente.nombre}\nID: ${cliente.clienteId}\nMoto: ${cliente.marca} ${cliente.modelo}\n\nGas: ${servicios.gas}L | Aceite: ${servicios.oil}L\nParche: ${document.getElementById('check-patch').checked ? "SÍ" : "NO"}\nGrúa: ${document.getElementById('check-tow').checked ? "SÍ" : "NO"}\n\nUbicación: ${mapa}`;
                window.open(`https://wa.me/523319053634?text=${encodeURIComponent(mensaje)}`, '_blank');
            });
        }
    </script>
</body>
</html>
