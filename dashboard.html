<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey App</title>
    <style>
        body { background-color: #1a2a33; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; }
        .card { background-color: #0d1117; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #333; }
        .logo { width: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #ff9f00; }
        h1 { font-size: 22px; margin-bottom: 5px; }
        .id-badge { background-color: #1f2937; color: #ff9f00; padding: 5px 15px; border-radius: 20px; font-size: 14px; display: inline-block; margin-bottom: 25px; border: 1px solid #ff9f00; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: #1f2937; padding: 15px; border-radius: 12px; text-decoration: none; color: white; font-size: 14px; border: 1px solid transparent; }
        .btn-whatsapp { width: 100%; padding: 15px; background-color: #25d366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; text-decoration: none; display: block; }
        .logout { color: #ff4444; text-decoration: none; display: block; margin-top: 25px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" class="logo" alt="Cailewey">
        <h1 id="saludo">¡Hola!</h1>
        <div class="id-badge" id="displayID">ID: CWY-0</div>
        <div class="menu-grid">
            <div class="menu-item">📅 Eventos</div>
            <div class="menu-item">💰 Pagos</div>
            <div class="menu-item">🎵 Música</div>
            <div class="menu-item">📄 Contratos</div>
        </div>
        <a href="https://wa.me/523319053634" class="btn-whatsapp">Soporte WhatsApp</a>
        <a href="index.html" onclick="localStorage.clear()" class="logout">Cerrar Sesión</a>
    </div>
    <script>
        window.onload = function() {
            const nombre = localStorage.getItem('usuarioNombre');
            const id = localStorage.getItem('usuarioID');
            if (!nombre) { window.location.href = 'index.html'; }
            else {
                document.getElementById('saludo').innerText = '¡Hola, ' + nombre.split(' ')[0] + '!';
                document.getElementById('displayID').innerText = 'ID: ' + id;
            }
        };
    </script>
</body>
</html>
