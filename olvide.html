<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar - Cailewey</title>
    <style>
        body { background-color: #1a2a33; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #0d1117; padding: 40px 20px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        h1 { color: white; font-size: 22px; margin-bottom: 20px; }
        p { color: #ccc; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-recuperar { width: 100%; padding: 15px; background-color: #ff9f00; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Recuperar Clave</h1>
        <p>Escribe tu número y te contactaremos por WhatsApp.</p>
        <input type="tel" id="recoveryPhone" placeholder="Tu número">
        <button onclick="enviarWhatsApp()" class="btn-recuperar">Pedir Ayuda</button>
        <br><br>
        <a href="index.html" style="color:#ccc; text-decoration:none;">Volver</a>
    </div>
    <script>
        function enviarWhatsApp() {
            const tel = document.getElementById('recoveryPhone').value;
            const msg = `Hola Cailewey! Olvidé mi clave. Mi número es: ${tel}`;
            window.open(`https://wa.me/523319053634?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
