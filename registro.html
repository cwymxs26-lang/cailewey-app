<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cailewey - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background: url('photo-1764605513771-c6a9789a4eb2.jpeg') no-repeat center center fixed; background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .glass { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border-radius: 25px; padding: 30px; width: 90%; max-width: 400px; color: white; }
        .input-box { position: relative; margin-bottom: 12px; }
        .input-box span { position: absolute; left: 15px; top: 12px; color: #ffc107; }
        .input-box input { width: 100%; padding: 12px 12px 12px 45px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; outline: none; }
        .btn-orange { background: linear-gradient(to right, #ff8c00, #ed5611); border: none; color: white; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="glass">
        <h3 class="text-center mb-4 text-warning">REGISTRO MOTO</h3>
        <div class="input-box"><span class="material-symbols-outlined">person</span><input type="text" id="reg-nombre" placeholder="Nombre Completo"></div>
        <div class="input-box"><span class="material-symbols-outlined">motorcycle</span><input type="text" id="reg-marca" placeholder="Marca (Ej: Italika)"></div>
        <div class="input-box"><span class="material-symbols-outlined">settings_suggest</span><input type="text" id="reg-modelo" placeholder="Modelo"></div>
        <div class="input-box"><span class="material-symbols-outlined">calendar_today</span><input type="number" id="reg-anio" placeholder="Año"></div>
        <button class="btn-orange w-100" onclick="guardarRegistro()">REGISTRARME</button>
        <div class="text-center mt-3"><a href="index.html" class="text-white small text-decoration-none">Volver al Login</a></div>
    </div>

    <script>
        function guardarRegistro() {
            let ultimoID = localStorage.getItem('ultimoIDCailewey') || "260100000000000";
            let nuevoID = (BigInt(ultimoID) + 1n).toString();
            const datos = {
                nombre: document.getElementById('reg-nombre').value,
                marca: document.getElementById('reg-marca').value,
                modelo: document.getElementById('reg-modelo').value,
                anio: document.getElementById('reg-anio').value,
                clienteId: nuevoID 
            };
            if(!datos.nombre) return alert("Llena tus datos");
            localStorage.setItem('userCailewey', JSON.stringify(datos));
            localStorage.setItem('ultimoIDCailewey', nuevoID);
            alert("¡Registro Exitoso! Bienvenido cliente: " + nuevoID);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
